<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>skycore 外联联调页 — boot-open</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --border: #2d3a4d;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9cf0;
      --ok: #3ecf8e;
      --err: #f07178;
      --mono: "SF Mono", "Menlo", Consolas, monospace;
      --sans: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 10% -10%, #1a2a44 0%, var(--bg) 55%);
      color: var(--text);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { font-size: 1.35rem; margin: 0 0 4px; font-weight: 650; }
    .sub { color: var(--muted); font-size: 0.9rem; margin-bottom: 20px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 16px;
      align-items: start;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }
    .card h2 {
      margin: 0 0 12px;
      font-size: 1rem;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tag {
      font-size: 0.7rem;
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 500;
    }
    label {
      display: block;
      font-size: 0.75rem;
      color: var(--muted);
      margin: 8px 0 4px;
    }
    input, textarea, select {
      width: 100%;
      background: #121a24;
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.9rem;
      font-family: var(--mono);
    }
    textarea { min-height: 72px; resize: vertical; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    button {
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.88rem;
      cursor: pointer;
      background: var(--accent);
      color: #041018;
      font-weight: 600;
    }
    button.secondary { background: #2a3648; color: var(--text); font-weight: 500; }
    button.danger { background: #5a2a32; color: #ffc9cd; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    #out {
      margin-top: 16px;
      background: #0c1118;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      font-family: var(--mono);
      font-size: 0.8rem;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 420px;
      overflow: auto;
      line-height: 1.45;
    }
    .status { font-size: 0.85rem; margin-top: 8px; }
    .status.ok { color: var(--ok); }
    .status.err { color: var(--err); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <h1>外联服务联调页</h1>
  <p class="sub">
    进程 <code>boot-open</code> · 默认 <code>http://localhost:8081</code> ·
    API 前缀 <code>/api/open</code> ·
    <a href="/api/open/wb/005/dashboard" target="_blank">打开 WB-005 JSON</a>
  </p>

  <div class="grid">
    <section class="card">
      <h2>JK-WB-001 载荷数据入站 <span class="tag">POST</span></h2>
      <div class="row">
        <div>
          <label>payloadId</label>
          <input id="p1_payloadId" value="PL-MHI-001" />
        </div>
        <div>
          <label>frameType</label>
          <input id="p1_frameType" value="MHI_SCI_20000" />
        </div>
      </div>
      <label>rawHex（SPO 原始帧）</label>
      <input id="p1_raw" value="EB90 2000 0001 000A 0000000186A0" />
      <div class="actions">
        <button type="button" onclick="sendWb001()">发送 WB-001（SPO 试点）</button>
      </div>
    </section>

    <section class="card">
      <h2>JK-WB-003 仿真指令入站 <span class="tag">POST</span></h2>
      <div class="row">
        <div><label>cmdSeq</label><input id="p3_seq" type="number" value="1001" /></div>
        <div><label>targetId</label><input id="p3_target" type="number" value="3" /></div>
      </div>
      <div class="row">
        <div><label>cmdCode</label><input id="p3_code" type="number" value="1" /></div>
        <div><label>workMode</label><input id="p3_mode" type="number" value="1" /></div>
      </div>
      <div class="row">
        <div><label>sampleFreq</label><input id="p3_freq" type="number" step="0.1" value="10" /></div>
        <div><label>exposure</label><input id="p3_exp" type="number" step="0.01" value="1.5" /></div>
      </div>
      <div class="actions">
        <button type="button" onclick="sendWb003()">发送 WB-003</button>
      </div>
    </section>

    <section class="card">
      <h2>查询 / 运维</h2>
      <p class="sub" style="margin:0 0 8px">WB-005 大屏快照、内存日志/存储、清空</p>
      <div class="actions">
        <button type="button" class="secondary" onclick="getDashboard()">拉取 WB-005</button>
        <button type="button" class="secondary" onclick="getDebug()">查看 debug/state</button>
        <button type="button" class="danger" onclick="doReset()">清空内存态</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </div>

  <div id="out">等待请求…</div>

  <script>
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");

    function showStatus(ok, text) {
      statusEl.className = "status " + (ok ? "ok" : "err");
      statusEl.textContent = text;
    }

    async function call(method, path, body) {
      const opts = { method, headers: { "Accept": "application/json" } };
      if (body !== undefined) {
        opts.headers["Content-Type"] = "application/json";
        opts.body = JSON.stringify(body);
      }
      const res = await fetch(path, opts);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch { json = text; }
      out.textContent = typeof json === "string" ? json : JSON.stringify(json, null, 2);
      const ok = res.ok && (typeof json !== "object" || json.code === 0);
      showStatus(ok, method + " " + path + " → HTTP " + res.status + (typeof json === "object" ? (" / code=" + json.code) : ""));
      return json;
    }

    function sendWb001() {
      return call("POST", "/api/open/wb/001/payload-data", {
        payloadId: document.getElementById("p1_payloadId").value,
        frameType: document.getElementById("p1_frameType").value,
        rawHex: document.getElementById("p1_raw").value
      });
    }

    function sendWb003() {
      return call("POST", "/api/open/wb/003/sim-command", {
        cmdTime: Date.now(),
        cmdSeq: Number(document.getElementById("p3_seq").value),
        targetId: Number(document.getElementById("p3_target").value),
        cmdCode: Number(document.getElementById("p3_code").value),
        workMode: Number(document.getElementById("p3_mode").value),
        sampleFreq: Number(document.getElementById("p3_freq").value),
        exposure: Number(document.getElementById("p3_exp").value),
        faultCode: 0,
        paraA: 0,
        paraB: 0
      });
    }

    function getDashboard() { return call("GET", "/api/open/wb/005/dashboard"); }
    function getDebug() { return call("GET", "/api/open/debug/state?limit=20"); }
    function doReset() { return call("POST", "/api/open/debug/reset"); }
  </script>
</body>
</html>
