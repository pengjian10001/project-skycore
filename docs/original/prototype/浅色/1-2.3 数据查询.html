            to {

        .table-scroll-wrapper {
            position: relative;
            width: 100%;
        }

        .table-scroll-wrapper table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .table-scroll-wrapper thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #f8fafc;
        }

        .table-scroll-wrapper thead th {
            background-color: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
        }

        .table-scroll-wrapper tbody {
            display: block;
            max-height: 216px;
            /* 6行 x 36px每行 */
            overflow-y: auto;
            overflow-x: hidden;
        }

        .table-scroll-wrapper thead tr,
        .table-scroll-wrapper tbody tr {
            display: table;
            width: 100%;
            table-layout: fixed;
        }

        .table-scroll-wrapper tbody tr {
            height: 36px;
        }

        .table-scroll-wrapper tbody::-webkit-scrollbar {
            width: 6px;
        }

        .table-scroll-wrapper tbody::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 3px;
        }

        .table-scroll-wrapper tbody::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;

                        <option value="telemetry">遥测数据</option>

                        </thead>
                        <tbody id="dataTableBody" class="divide-y divide-slate-100">

                    </table>
                </div>

                        <button onclick="goToPage(currentPage + 1)" id="nextBtn"

                            <i class="fa-solid fa-angles-right"></i>
                        </button>
                    </div>
                </div>
            </div>

            <footer class="text-center text-[10px] text-slate-400 mt-4 pb-2">

            { id: 'CMD-2025-008', name: '粒子类型设置', instrument: '太阳风离子阻滞势分析仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '离子质谱分析', type: 'engineering', typeName: '工程参数', time: '2025-01-15 10:42:55', size: '28.4 MB', status: 'returning', statusName: '数据回传中' },
            { id: 'CMD-2025-009', name: '磁场校准', instrument: '磁强计', taskType: 'ground', taskTypeName: '地面测试', task: '磁场扫描测试', type: 'engineering', typeName: '工程参数', time: '2025-01-15 10:43:02', size: '15.2 MB', status: 'completed', statusName: '已完成' },
            { id: 'CMD-2025-010', name: '温度监控', instrument: '磁场速度场成像仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '太阳风观测', type: 'telemetry', typeName: '遥测数据', time: '2025-01-15 10:43:09', size: '8.5 MB', status: 'parsing', statusName: '解析下发中' },
            { id: 'CMD-2024-089', name: '全日面扫描', instrument: '多波段极紫外成像仪', taskType: 'ground', taskTypeName: '地面测试', task: '多波段成像测试', type: 'science', typeName: '科学数据', time: '2024-12-28 14:22:15', size: '850.2 MB', status: 'processing', statusName: '处理中' },
            { id: 'CMD-2024-090', name: '光谱数据采集', instrument: '全日面极紫外光谱仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '极紫外光谱分析', type: 'science', typeName: '科学数据', time: '2024-12-28 14:22:22', size: '248.5 MB', status: 'returning', statusName: '数据回传中' },
            { id: 'CMD-2024-091', name: '日冕观测', instrument: '白光日冕仪', taskType: 'ground', taskTypeName: '地面测试', task: '日冕成像测试', type: 'science', typeName: '科学数据', time: '2024-12-28 14:22:29', size: '38.6 MB', status: 'completed', statusName: '已完成' },
            { id: 'CMD-2024-092', name: '深空成像', instrument: '日球成像仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '多波段成像测试', type: 'science', typeName: '科学数据', time: '2024-12-28 14:22:36', size: '512.3 MB', status: 'parsing', statusName: '解析下发中' },
            { id: 'CMD-2024-093', name: 'X射线爆发监测', instrument: 'X射线成像望远镜', taskType: 'ground', taskTypeName: '地面测试', task: '日冕物质抛射', type: 'science', typeName: '科学数据', time: '2024-12-28 14:22:43', size: '64.8 MB', status: 'processing', statusName: '处理中' },
            { id: 'CMD-2024-094', name: '太阳风速度测量', instrument: '太阳风离子质谱分析仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '太阳风离子分析', type: 'telemetry', typeName: '遥测数据', time: '2024-12-28 14:22:50', size: '32.4 MB', status: 'returning', statusName: '数据回传中' },
            { id: 'CMD-2024-095', name: '电位分析', instrument: '太阳风离子阻滞势分析仪', taskType: 'ground', taskTypeName: '地面测试', task: '离子质谱分析', type: 'engineering', typeName: '工程参数', time: '2024-12-28 14:22:57', size: '18.6 MB', status: 'completed', statusName: '已完成' },
            { id: 'CMD-2024-096', name: '磁场强度记录', instrument: '磁强计', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '磁场扫描测试', type: 'telemetry', typeName: '遥测数据', time: '2024-12-28 14:23:04', size: '12.3 MB', status: 'parsing', statusName: '解析下发中' },
            { id: 'CMD-2024-097', name: '系统状态检查', instrument: '磁场速度场成像仪', taskType: 'ground', taskTypeName: '地面测试', task: '太阳风观测', type: 'engineering', typeName: '工程参数', time: '2024-12-28 14:23:11', size: '5.8 MB', status: 'processing', statusName: '处理中' },
            { id: 'CMD-2024-098', name: '数据同步测试', instrument: '多波段极紫外成像仪', taskType: 'orbit', taskTypeName: '在轨运行仿真', task: '多波段成像测试', type: 'telemetry', typeName: '遥测数据', time: '2024-12-28 14:23:18', size: '22.1 MB', status: 'returning', statusName: '数据回传中' },
        ];

        // 生成更多模拟数据（添加测试任务字段和任务类型字段）
        for (let i = 21; i <= 128; i++) {
            const years = ['2025', '2024', '2023', '2022'];
            const instruments = ['磁场速度场成像仪', '多波段极紫外成像仪', '全日面极紫外光谱仪', '白光日冕仪', '日球成像仪', 'X射线成像望远镜', '太阳风离子质谱分析仪', '太阳风离子阻滞势分析仪', '磁强计'];
            const types = [
                { code: 'science', name: '科学数据' },
                { code: 'telemetry', name: '遥测数据' },
                { code: 'engineering', name: '工程参数' }
            ];
            const statuses = [
                { code: 'completed', name: '已完成', class: 'bg-green-100 text-green-700' },
                { code: 'processing', name: '处理中', class: 'bg-blue-100 text-blue-700' },
                { code: 'parsing', name: '解析下发中', class: 'bg-purple-100 text-purple-700' },
                { code: 'returning', name: '数据回传中', class: 'bg-amber-100 text-amber-700' }
            ];
            const taskTypes = [
                { code: 'ground', name: '地面测试' },
                { code: 'orbit', name: '在轨运行仿真' }
            ];

            const year = years[Math.floor(Math.random() * years.length)];
            const month = String(Math.floor(Math.random() * 12) + 1).padStart(2, '0');
            const day = String(Math.floor(Math.random() * 28) + 1).padStart(2, '0');
            const taskType = taskTypes[Math.floor(Math.random() * taskTypes.length)];

            mockData.push({
                id: `CMD-${year}-${String(i).padStart(3, '0')}`,
                name: `数据采集任务-${i}`,
                instrument: instruments[Math.floor(Math.random() * instruments.length)],
                taskType: taskType.code,
                taskTypeName: taskType.name,
                task: taskNames[Math.floor(Math.random() * taskNames.length)],
                type: types[Math.floor(Math.random() * types.length)].code,
                typeName: types[Math.floor(Math.random() * types.length)].name,
                time: `${year}-${month}-${day} ${String(Math.floor(Math.random() * 24)).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}:${String(Math.floor(Math.random() * 60)).padStart(2, '0')}`,
                size: `${(Math.random() * 1000).toFixed(1)} MB`,
                status: statuses[Math.floor(Math.random() * statuses.length)].code,
                statusName: statuses[Math.floor(Math.random() * statuses.length)].name
            });
        }

        // 分页状态
        let currentPage = 1;
        let pageSize = 10;
        let filteredData = [...mockData];
        let totalPages = Math.ceil(filteredData.length / pageSize);

        // 初始化
        document.addEventListener('DOMContentLoaded', function () {
            renderTable();
            renderPagination();
            setupFilterListeners();
        });

        // 渲染表格 - 添加任务类型列显示
        function renderTable() {
            const tbody = document.getElementById('dataTableBody');
            const start = (currentPage - 1) * pageSize;
            const end = Math.min(start + pageSize, filteredData.length);
            const pageData = filteredData.slice(start, end);

            tbody.innerHTML = pageData.map(row => {
                const statusClass = row.status === 'completed' ? 'bg-green-100 text-green-700' :
                    row.status === 'processing' ? 'bg-blue-100 text-blue-700' :
                        row.status === 'parsing' ? 'bg-purple-100 text-purple-700' : 'bg-amber-100 text-amber-700';

                const typeClass = row.type === 'science' ? 'bg-blue-50 text-blue-700' :
                    row.type === 'telemetry' ? 'bg-emerald-50 text-emerald-700' : 'bg-orange-50 text-orange-700';

                return `
                    <tr class="transition-colors hover:bg-slate-50">
                        <td class="px-4 py-3">
                            <input type="checkbox" class="rounded border-slate-300 text-sky-500 focus:ring-sky-500">
                        </td>
                        <td class="px-4 py-3 font-mono text-slate-600">${row.id}</td>
                        <td class="px-4 py-3 font-medium text-slate-800">${row.name}</td>
                        <td class="px-4 py-3">
                            <span class="text-[10px] px-2 py-0.5 rounded bg-slate-100 text-slate-600">${row.instrument}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="text-[10px] px-2 py-0.5 rounded ${row.taskType === 'ground' ? 'bg-amber-50 text-amber-700' : 'bg-cyan-50 text-cyan-700'}">${row.taskTypeName}</span>
                        </td>
                        <!-- 新增：测试任务列 -->
                        <td class="px-4 py-3">
                            <span class="text-[10px] px-2 py-0.5 rounded bg-indigo-50 text-indigo-700">${row.task}</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="text-[10px] px-2 py-0.5 rounded ${typeClass}">${row.typeName}</span>
                        </td>
                        <td class="px-4 py-3 text-slate-500">${row.time}</td>
                        <td class="px-4 py-3 font-mono text-slate-700">${row.size}</td>
                        <td class="px-4 py-3">
                            <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] font-medium ${statusClass}">
                                <span class="w-1 h-1 rounded-full ${row.status === 'completed' ? 'bg-green-500' : row.status === 'processing' ? 'bg-blue-500 animate-pulse' : row.status === 'parsing' ? 'bg-purple-500 animate-pulse' : 'bg-amber-500 animate-pulse'}"></span>
                                ${row.statusName}
                            </span>
                        </td>
                        <td class="px-4 py-3 text-center">
                            <button class="inline-flex items-center gap-1 px-2 py-1 text-[10px] bg-sky-50 text-sky-600 rounded hover:bg-sky-100 transition-colors mr-1" title="查看详情">
                                <i class="fa-solid fa-eye"></i> 详情
                            </button>
                            ${row.status === 'completed' ? `
                            <button class="inline-flex items-center gap-1 px-2 py-1 text-[10px] bg-emerald-50 text-emerald-600 rounded hover:bg-emerald-100 transition-colors" title="导出数据">
                                <i class="fa-solid fa-download"></i> 数据下载
                            </button>
                            ` : `
                            <button class="inline-flex items-center gap-1 px-2 py-1 text-[10px] bg-emerald-50 text-emerald-600 rounded hover:bg-emerald-100 transition-colors opacity-50 cursor-not-allowed" title="数据未就绪" disabled>
                                <i class="fa-solid fa-download"></i>
                            </button>
                            `}
                        </td>
                    </tr>
                `;
            }).join('');

            // 更新分页信息
            document.getElementById('startRow').textContent = filteredData.length > 0 ? start + 1 : 0;
            document.getElementById('endRow').textContent = end;
            document.getElementById('totalRows').textContent = filteredData.length;
            document.getElementById('totalCount').textContent = filteredData.length;
        }

        // 渲染分页
        function renderPagination() {
            totalPages = Math.ceil(filteredData.length / pageSize);
            const pageNumbers = document.getElementById('pageNumbers');

            let html = '';
            const maxVisible = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxVisible / 2));
            let endPage = Math.min(totalPages, startPage + maxVisible - 1);

            if (endPage - startPage < maxVisible - 1) {
                startPage = Math.max(1, endPage - maxVisible + 1);
            }

            for (let i = startPage; i <= endPage; i++) {
                html += `<button onclick="goToPage(${i})" class="pagination-btn px-2.5 py-1 border border-slate-200 rounded text-[11px] ${i === currentPage ? 'active' : 'text-slate-600'}">${i}</button>`;
            }

            pageNumbers.innerHTML = html;

            // 更新按钮状态
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage === totalPages;
        }

        // 跳转页面
        function goToPage(page) {
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderTable();
            renderPagination();
        }

        // 改变每页数量
        function changePageSize() {
            pageSize = parseInt(document.getElementById('pageSize').value);
            currentPage = 1;
            renderTable();
            renderPagination();
        }

        // 执行搜索 - 调整筛选逻辑顺序，添加时间段筛选
        function performSearch() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const instrument = document.getElementById('filterInstrument').value;
            const type = document.getElementById('filterType').value;
            const dateStart = document.getElementById('filterDateStart').value;
            const dateEnd = document.getElementById('filterDateEnd').value;
            const taskType = document.getElementById('filterTaskType').value;
            const task = document.getElementById('filterTask').value;
            const status = document.getElementById('filterStatus').value;

            filteredData = mockData.filter(row => {
                const matchKeyword = !keyword ||
                    row.id.toLowerCase().includes(keyword) ||
                    row.name.toLowerCase().includes(keyword) ||
                    row.instrument.toLowerCase().includes(keyword) ||
                    row.task.toLowerCase().includes(keyword);

                const matchInstrument = !instrument || row.instrument === instrument;
                const matchType = !type || row.type === type;

                // 时间段筛选逻辑
                let matchDate = true;
                if (dateStart) {
                    matchDate = matchDate && row.time >= dateStart + ' 00:00:00';
                }
                if (dateEnd) {
                    matchDate = matchDate && row.time <= dateEnd + ' 23:59:59';
                }

                const matchTaskType = !taskType || row.taskType === taskType;
                const matchTask = !task || row.task === task;
                const matchStatus = !status || row.status === status;

                return matchKeyword && matchInstrument && matchType && matchDate && matchTaskType && matchTask && matchStatus;
            });

            currentPage = 1;
            renderTable();
            renderPagination();
            updateActiveFilters();
        }

        // 重置搜索
        function resetSearch() {
            document.getElementById('searchInput').value = '';
            document.getElementById('filterInstrument').value = '';
            document.getElementById('filterType').value = '';
            document.getElementById('filterDateStart').value = '';
            document.getElementById('filterDateEnd').value = '';
            document.getElementById('filterTaskType').value = '';
            document.getElementById('filterTask').value = '';
            document.getElementById('filterStatus').value = '';

            filteredData = [...mockData];
            currentPage = 1;
            renderTable();
            renderPagination();
            updateActiveFilters();
        }

        // 设置筛选监听器 - 调整顺序，移除年份监听，添加日期监听
        function setupFilterListeners() {
            const filters = ['filterInstrument', 'filterType', 'filterTaskType', 'filterTask', 'filterStatus'];
            filters.forEach(id => {
                document.getElementById(id).addEventListener('change', performSearch);
            });

            // 日期输入框监听
            document.getElementById('filterDateStart').addEventListener('change', performSearch);
            document.getElementById('filterDateEnd').addEventListener('change', performSearch);

            document.getElementById('searchInput').addEventListener('keypress', function (e) {
                if (e.key === 'Enter') performSearch();
            });
        }

        // 更新已选筛选标签 - 调整顺序，移除年份，添加时间段
        function updateActiveFilters() {
            const container = document.getElementById('activeFilters');
            const filters = [];

            const instrument = document.getElementById('filterInstrument').value;
            if (instrument) filters.push({ label: instrument, key: 'instrument' });

            const type = document.getElementById('filterType').value;
            if (type) {
                const typeNames = { science: '科学数据', telemetry: '遥测数据', engineering: '工程参数' };
                filters.push({ label: typeNames[type], key: 'type' });
            }

            const dateStart = document.getElementById('filterDateStart').value;
            const dateEnd = document.getElementById('filterDateEnd').value;
            if (dateStart || dateEnd) {
                let dateLabel = '';
                if (dateStart && dateEnd) {
                    dateLabel = `${dateStart} 至 ${dateEnd}`;
                } else if (dateStart) {
                    dateLabel = `自 ${dateStart}`;
                } else {
                    dateLabel = `至 ${dateEnd}`;
                }
                filters.push({ label: dateLabel, key: 'dateRange' });
            }

            const taskType = document.getElementById('filterTaskType').value;
            if (taskType) {
                const taskTypeNames = { ground: '地面测试', orbit: '在轨运行仿真' };
                filters.push({ label: taskTypeNames[taskType], key: 'taskType' });
            }

            const task = document.getElementById('filterTask').value;
            if (task) filters.push({ label: task, key: 'task' });

            const status = document.getElementById('filterStatus').value;
            if (status) {
                const statusNames = { completed: '已完成', processing: '处理中', parsing: '解析下发中', returning: '数据回传中' };
                filters.push({ label: statusNames[status], key: 'status' });
            }

            if (filters.length === 0) {
                container.innerHTML = '<span class="text-[11px] text-slate-400">暂无筛选条件</span>';
            } else {
                container.innerHTML = filters.map(f => `
                    <span class="filter-tag inline-flex items-center gap-1 px-2 py-1 bg-sky-50 text-sky-700 text-[10px] rounded border border-sky-200">
                        ${f.label}
                        <button onclick="clearFilter('${f.key}')" class="hover:text-sky-900">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </span>
                `).join('');
            }
        }

        // 清除单个筛选 - 调整映射，移除年份，添加时间段
        function clearFilter(key) {
            const map = { 
                instrument: 'filterInstrument', 
                type: 'filterType', 
                taskType: 'filterTaskType', 
                task: 'filterTask', 
                status: 'filterStatus' 
            };

            if (key === 'dateRange') {
                document.getElementById('filterDateStart').value = '';
                document.getElementById('filterDateEnd').value = '';
            } else if (map[key]) {
                document.getElementById(map[key]).value = '';
            }

            performSearch();
        }

        // 排序
        let sortField = '';
        let sortOrder = 'asc';
        function sortTable(field) {
            if (sortField === field) {
                sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
            } else {
                sortField = field;
                sortOrder = 'asc';
            }

            filteredData.sort((a, b) => {
                let valA = a[field];
                let valB = b[field];

                if (field === 'time') {
                    valA = new Date(valA);
                    valB = new Date(valB);
                }

                if (sortOrder === 'asc') {
                    return valA > valB ? 1 : -1;
                } else {
                    return valA < valB ? 1 : -1;
                }
            });

            renderTable();
        }

        // 子菜单切换
        function toggleSubmenu(element) {
            element.classList.toggle('expanded');
        }
    </script>
